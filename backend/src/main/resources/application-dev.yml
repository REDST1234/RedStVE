spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/.env[.properties]"
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:redstve}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  ai:
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        tenant-name: ${CHROMA_TENANT_NAME:default_tenant}
        database-name: ${CHROMA_DATABASE_NAME:default_database}
        collection-name: ${CHROMA_COLLECTION_NAME:ai_video}
        initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:true}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
asr:
  doubao:
    model: ${ASR_DOUBAO_MODEL:doubao-seed-2-0-lite-260428}
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: now(3)
      logic-not-delete-value: "null"

logging:
  file:
    name: logs/bytedance-ai-video-dev.log
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 10MB
  level:
    root: INFO
    com.bytedance.aivideo: debug
  charset:
    console: UTF-8
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint}
      %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %clr(%m)\n"

spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/.env[.properties]"
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:redstve}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  ai:
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        tenant-name: ${CHROMA_TENANT_NAME:default_tenant}
        database-name: ${CHROMA_DATABASE_NAME:default_database}
        collection-name: ${CHROMA_COLLECTION_NAME:ai_video}
        initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:true}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
asr:
  doubao:
    model: ${ASR_DOUBAO_MODEL:doubao-seed-2-0-lite-260428}
comfyui:
  base-url: ${COMFYUI_BASE_URL:http://localhost:8001}
  workflow-path: ${COMFYUI_WORKFLOW_PATH:config/comfyui_bg_removal_workflow.json}
  poll-timeout-seconds: ${COMFYUI_POLL_TIMEOUT:120}
  timeout-seconds: ${COMFYUI_TIMEOUT:60}

seedream:
  api-key: ${SEEDREAM_API_KEY:}
  model: ${SEEDREAM_MODEL:doubao-seedream-4-0-250828}
  size: ${SEEDREAM_SIZE:2K}
  watermark: ${SEEDREAM_WATERMARK:true}
  response-format: ${SEEDREAM_RESPONSE_FORMAT:url}

sfx-audio:
  mappings:
    typewriter_loop: ${SFX_TYPEWRITER_LOOP:http://localhost:8080/api/storage/audio-database/sfx/typewriter_loop.wav}
    type_end_click: ${SFX_TYPE_END_CLICK:http://localhost:8080/api/storage/audio-database/sfx/type_end_click.wav}
    emphasis_hit: ${SFX_EMPHASIS_HIT:http://localhost:8080/api/storage/audio-database/sfx/emphasis_hit.wav}
    transition_whoosh: ${SFX_TRANSITION_WHOOSH:http://localhost:8080/api/storage/audio-database/sfx/transition_whoosh.wav}
    brand_logo_hit: ${SFX_BRAND_LOGO_HIT:http://localhost:8080/api/storage/audio-database/sfx/brand_logo_hit.wav}
    ui_click: ${SFX_UI_CLICK:http://localhost:8080/api/storage/audio-database/sfx/ui_click.wav}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  file:
    name: logs/bytedance-ai-video-dev.log
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 10MB
  level:
    root: INFO
    com.bytedance.aivideo: debug
  charset:
    console: UTF-8
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint}
      %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %clr(%m)\n"

creation:
  template-vector:
    collection-name: ${CREATION_TEMPLATE_COLLECTION:creation_template}
  bgm-vector:
    collection-name: ${CREATION_BGM_COLLECTION:creation_bgm}
    audio-database-dir: ${AUDIO_DATABASE_DIR:d:/Develop/code/bytedance-ai-video/storage/audio-database}
vector.auto-init.enabled: true

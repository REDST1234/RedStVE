spring:
  datasource:
    url: jdbc:mysql://prod-db:3306/ai_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  ai:
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
          key-token: ${CHROMA_KEY_TOKEN:}
          username: ${CHROMA_USERNAME:}
          password: ${CHROMA_PASSWORD:}
        tenant-name: ${CHROMA_TENANT_NAME:default_tenant}
        database-name: ${CHROMA_DATABASE_NAME:default_database}
        collection-name: ${CHROMA_COLLECTION_NAME:ai_video}
        initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:false}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: now(3)
      logic-not-delete-value: "null"

logging:
  level:
    com.bytedance.aivideo: info

creation:
  template-vector:
    collection-name: ${CREATION_TEMPLATE_COLLECTION:creation_template}
  bgm-vector:
    collection-name: ${CREATION_BGM_COLLECTION:creation_bgm}
    audio-database-dir: ${AUDIO_DATABASE_DIR:storage/audio-database}

comfyui:
  base-url: ${COMFYUI_BASE_URL:http://localhost:8001}
  workflow-path: ${COMFYUI_WORKFLOW_PATH:config/comfyui_bg_removal_workflow.json}
  poll-timeout-seconds: ${COMFYUI_POLL_TIMEOUT:120}
  timeout-seconds: ${COMFYUI_TIMEOUT:60}

seedream:
  api-key: ${SEEDREAM_API_KEY:}
  model: ${SEEDREAM_MODEL:doubao-seedream-4-0-250828}
  size: ${SEEDREAM_SIZE:2K}
  watermark: ${SEEDREAM_WATERMARK:true}

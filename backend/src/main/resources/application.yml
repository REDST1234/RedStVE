server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:2048MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:4096MB}
  output:
    ansi:
      enabled: always
  ai:
    model:
      embedding: ${SPRING_AI_MODEL_EMBEDDING:ollama}
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
          key-token: ${CHROMA_KEY_TOKEN:}
          username: ${CHROMA_USERNAME:}
          password: ${CHROMA_PASSWORD:}
        tenant-name: ${CHROMA_TENANT_NAME:default_tenant}
        database-name: ${CHROMA_DATABASE_NAME:default_database}
        collection-name: ${CHROMA_COLLECTION_NAME:ai_video}
        initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:true}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    table: flyway_schema_history
    clean-disabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

media:
  ffprobe:
    path: ${FFPROBE_PATH:ffprobe}
    timeout-seconds: ${FFPROBE_TIMEOUT_SECONDS:20}
  ffmpeg:
    path: ${FFMPEG_PATH:ffmpeg}
    operation-timeout-seconds: ${FFMPEG_OPERATION_TIMEOUT_SECONDS:120}
    grid-max-pages: ${FFMPEG_GRID_MAX_PAGES:12}
    audio-timeout-seconds: ${FFMPEG_AUDIO_TIMEOUT_SECONDS:120}
  upload:
    directory: ${MEDIA_UPLOAD_DIR:storage/analysis-video}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:2147483648}
    allowed-extensions:
      - mp4
      - mov

ark:
  base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com}
  api-key: ${ARK_API_KEY:}
  model: ${ARK_MODEL_ENDPOINT:}
  chat-completions-path: ${ARK_CHAT_COMPLETIONS_PATH:/api/v3/chat/completions}
  timeout-seconds: ${ARK_TIMEOUT_SECONDS:200}
  max-retries: ${ARK_MAX_RETRIES:1}

asr:
  max-audio-bytes: ${ASR_MAX_AUDIO_BYTES:20971520}
  audio-output-dir: ${ASR_AUDIO_OUTPUT_DIR:storage/analysis-audio}
  doubao:
    model: ${ASR_DOUBAO_MODEL:doubao-seed-2-0-lite-260428}

comfyui:
  base-url: ${COMFYUI_BASE_URL:http://localhost:8001}
  workflow-path: ${COMFYUI_WORKFLOW_PATH:config/comfyui_bg_removal_workflow.json}
  poll-timeout-seconds: ${COMFYUI_POLL_TIMEOUT:120}
  timeout-seconds: ${COMFYUI_TIMEOUT:60}

seedream:
  api-key: ${SEEDREAM_API_KEY:}
  model: ${SEEDREAM_MODEL:doubao-seedream-4-0-250828}
  images-path: ${SEEDREAM_IMAGES_PATH:/api/v3/images/generations}
  size: ${SEEDREAM_SIZE:2K}
  watermark: ${SEEDREAM_WATERMARK:true}
  response-format: ${SEEDREAM_RESPONSE_FORMAT:url}
  sequential-image-generation: ${SEEDREAM_SEQUENTIAL_IMAGE_GENERATION:disabled}
  timeout-seconds: ${SEEDREAM_TIMEOUT_SECONDS:120}

sfx-audio:
  mappings:
    typewriter_loop: ${SFX_TYPEWRITER_LOOP:http://localhost:8080/api/storage/audio-database/sfx/typewriter_loop.wav}
    type_end_click: ${SFX_TYPE_END_CLICK:http://localhost:8080/api/storage/audio-database/sfx/type_end_click.wav}
    emphasis_hit: ${SFX_EMPHASIS_HIT:http://localhost:8080/api/storage/audio-database/sfx/emphasis_hit.wav}
    transition_whoosh: ${SFX_TRANSITION_WHOOSH:http://localhost:8080/api/storage/audio-database/sfx/transition_whoosh.wav}
    brand_logo_hit: ${SFX_BRAND_LOGO_HIT:http://localhost:8080/api/storage/audio-database/sfx/brand_logo_hit.wav}
    ui_click: ${SFX_UI_CLICK:http://localhost:8080/api/storage/audio-database/sfx/ui_click.wav}

timeline:
  min-segment-duration-sec: ${TIMELINE_MIN_SEGMENT_DURATION_SEC:0.60}
  float-epsilon: ${TIMELINE_FLOAT_EPSILON:0.000001}

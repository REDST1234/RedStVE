server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-3.5-turbo}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

name: CI Pipeline

# 触发条件：当有人向 main 分支 push 代码，或者提 PR 时，触发此流水线
on:
  push:
    # 使用 '**' 代表匹配所有分支。这样你在本地新建一个测试分支 push 上去也能立刻触发
    branches: ["**"]
  pull_request:
    branches: ["**"]

# jobs 是具体要执行的工作流任务，不同的 job 会在 GitHub 的多台服务器上**并发**执行
jobs:
  # 任务1：测试 Java 后端能否编译成功
  build-java:
    runs-on: ubuntu-latest # 在最新的 Ubuntu 环境下运行

    steps:
      # Step 1: 把你的代码拉取到这台临时的 GitHub 服务器上
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: 在这台机器上安装 Java 21 环境
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven # 开启 Maven 依赖缓存，下次跑就不用重新下包了

      # Step 3: 安装 FFmpeg（解决测试代码中调用本地 ffmpeg 的问题）
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Step 4: 进入 backend 目录，执行 Maven 构建和测试
      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package
      
      - name: Show Surefire Reports
        if: failure()
        working-directory: ./backend
        run: cat target/surefire-reports/*.txt || true

  # 任务2：测试 Node.js 的 Remotion 服务能否编译成功
  build-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 在这台机器上安装 Node.js 20 环境
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # 开启 npm 缓存
          cache-dependency-path: ./remotion-service/package-lock.json

      # 进入 remotion-service 目录安装依赖并尝试 Build
      - name: Install dependencies and Build
        working-directory: ./remotion-service
        run: |
          npm ci
          npm run build
